[project]
name = "civil-engineering-backend"
version = "0.1.0"
description = "FastAPI backend for the Civil Engineering AI application"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "bcrypt>=4.1,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "ezdxf>=1.4,<2",
  "pillow>=11,<12",
  "pypdf>=5.0,<6",
  "pyproj>=3.7,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.34,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9"
  ,"ruff>=0.9,<1"
  ,"types-shapely>=2.0,<3"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
